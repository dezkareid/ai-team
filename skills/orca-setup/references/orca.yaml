# Orca worktree hooks — generated by the ai-team orca-setup skill
# Docs: https://www.onorca.dev/docs/model/worktrees
scripts:
  # Runs in the new worktree after it is created
  setup: |
    set -eu
    : "${ORCA_ROOT_PATH:?ORCA_ROOT_PATH not set}"
    : "${ORCA_WORKTREE_PATH:?ORCA_WORKTREE_PATH not set}"
    # Copy gitignored env files (any depth) from the main checkout.
    # .worktreeinclude only supports literal paths, so nested app env files are found here.
    cd "$ORCA_ROOT_PATH"
    find . \( -name node_modules -o -name .git -o -name .turbo -o -name .next -o -name dist \) -prune -o \
      -type f -name '.env*' ! -name '*.example' ! -name '*.sample' ! -name '*.template' -print |
    while IFS= read -r f; do
      git check-ignore -q "$f" || continue
      dest="$ORCA_WORKTREE_PATH/$f"
      [ -e "$dest" ] && continue
      mkdir -p "$(dirname "$dest")"
      cp "$f" "$dest"
      echo "==> copied $f"
    done
    cd "$ORCA_WORKTREE_PATH"
    pnpm install --frozen-lockfile
  # Runs in the worktree before it is archived/removed
  archive: |
    find . -name node_modules -type d -prune -exec rm -rf {} +
